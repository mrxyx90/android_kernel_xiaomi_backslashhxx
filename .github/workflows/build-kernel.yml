name: Build YSL Kernel (Lineage 23.2)

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-23.2

permissions:
  contents: read

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    name: Build msm8953-perf_defconfig
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Build kernel
        uses: dabao1955/kernel_build_action@v1.2
        with:
          kernel-url: https://github.com/mrxyx90/android_kernel_xiaomi_backslashhxx
          kernel-branch: lineage-23.2
          config: msm8953-perf_defconfig
          arch: arm64
          aosp-gcc: true
          aosp-clang: true
          android-version: 12
          aosp-clang-version: r383902
          ccache: true
          anykernel3: true
