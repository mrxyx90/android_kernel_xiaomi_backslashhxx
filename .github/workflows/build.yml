name: Build YSL Kernel

on:
  workflow_dispatch:
  push:
    branches: [ ysl ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ysl

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex libssl-dev libelf-dev python3 unzip zip wget xz-utils

      - name: Download Proton Clang
        run: |
          set -eux
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/proton-clang"
          test -x "$HOME/proton-clang/bin/clang"
          "$HOME/proton-clang/bin/clang" --version
          echo "$HOME/proton-clang/bin" >> "$GITHUB_PATH"

      - name: Verify Clang
        run: |
          set -eux
          command -v clang
          clang --version
          command -v ld.lld || true
          command -v aarch64-linux-gnu-ld

      - name: Build YSL kernel
        run: |
          set -eux
          export ARCH=arm64
          export SUBARCH=arm64

          unset CFLAGS CXXFLAGS CPPFLAGS KCFLAGS KCPPFLAGS
          unset HOST_EXTRACFLAGS HOST_EXTRACXXFLAGS

          make O=out ARCH=arm64 msm8953_defconfig
          scripts/config --file out/.config --disable CONFIG_CC_STACKPROTECTOR_STRONG
          make O=out ARCH=arm64 olddefconfig

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Collect kernel
        run: |
          set -eux
          mkdir -p artifacts
          find out/arch/arm64/boot -maxdepth 1 -type f -exec cp {} artifacts/ \;
          find out -type f \( -name '*.dtb' -o -name 'dtb' -o -name 'dtbo.img' \) -exec cp {} artifacts/ \; || true
          ls -lah artifacts

      - name: Upload YSL kernel
        uses: actions/upload-artifact@v4
        with:
          name: ysl-msm8953-kernel
          path: artifacts/
