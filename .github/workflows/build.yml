name: Build YSL Kernel

on:
  workflow_dispatch:
  push:
    branches: [ ysl ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout YSL
        uses: actions/checkout@v4
        with:
          ref: ysl
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi libssl-dev libelf-dev python3 rsync unzip zip wget xz-utils lz4 abootimg

      - name: Download Proton Clang
        run: |
          set -eux
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git "$HOME/proton-clang"
          test -x "$HOME/proton-clang/bin/clang"
          echo "$HOME/proton-clang/bin" >> "$GITHUB_PATH"

      - name: Verify 32-bit toolchain for YSL vDSO
        run: |
          set -eux
          command -v arm-linux-gnueabi-gcc
          command -v arm-linux-gnueabi-ld
          arm-linux-gnueabi-gcc --version
          arm-linux-gnueabi-ld -v

      - name: Build YSL kernel
        run: |
          set -eux
          export DEVICENAME=ysl
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export PATH="$HOME/proton-clang/bin:$PATH"
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 2G || true

          rm -rf out_ysl
          mkdir -p out_ysl
          echo 'CONFIG_LOCALVERSION="-ysl"' > /tmp/lineageos_xx_devicename

          ARCH=arm64 scripts/kconfig/merge_config.sh -O out_ysl \
            arch/arm64/configs/msm8953-perf_defconfig \
            arch/arm64/configs/xiaomi/xiaomi.config \
            arch/arm64/configs/xiaomi/ysl.config \
            lineageos_xx_append \
            lineageos_xx_vdso \
            /tmp/lineageos_xx_devicename

          make -j"$(nproc)" \
            ARCH=arm64 SUBARCH=arm64 O=out_ysl \
            CC='ccache clang' \
            AS=clang \
            AR=llvm-ar \
            NM=llvm-nm \
            LD=ld.lld \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_GCC32_TC='-gcc-toolchain /usr' \
            CLANG_PREFIX32='--prefix=/usr/bin/arm-linux-gnueabi-' \
            LLVM=1 \
            LLVM_IAS=1 \
            INSTALL_MOD_STRIP=1 \
            KBUILD_BUILD_USER="$(git rev-parse --short HEAD | cut -c1-7)" \
            KBUILD_BUILD_HOST="$(git symbolic-ref --short HEAD)" \
            KBUILD_BUILD_FEATURES='source: https://github.com/backslashxx/msm8953-kernel //'

          ccache -s
          rm -f /tmp/lineageos_xx_devicename

      - name: Prepare YSL kernel
        run: |
          set -eux
          mkdir -p artifacts
          test -f out_ysl/arch/arm64/boot/Image.gz || test -f out_ysl/arch/arm64/boot/Image
          cp out_ysl/arch/arm64/boot/Image* artifacts/ || true

      - name: Fetch stock YSL boot image
        run: |
          set -eux
          test -n "${{ vars.YSL_BOOT_IMG_URL }}"
          wget -q -O stock-ysl-boot.img "${{ vars.YSL_BOOT_IMG_URL }}"
          test -s stock-ysl-boot.img

      - name: Repack YSL boot.img
        run: |
          set -eux
          rm -rf boot-extracted
          mkdir -p boot-extracted
          abootimg -x stock-ysl-boot.img -o boot-extracted
          test -f boot-extracted/bootimg.cfg
          test -f boot-extracted/ramdisk.img

          # The supplied stock YSL image is the known-good boot container.
          # Preserve its header, ramdisk and boot arguments; replace only the kernel.
          if [ -f out_ysl/arch/arm64/boot/Image.gz ]; then
            cp out_ysl/arch/arm64/boot/Image.gz boot-extracted/zImage
          else
            cp out_ysl/arch/arm64/boot/Image boot-extracted/zImage
          fi

          abootimg --create boot.img \
            -f boot-extracted/bootimg.cfg \
            -k boot-extracted/zImage \
            -r boot-extracted/ramdisk.img

          test -s boot.img
          abootimg -i boot.img
          cp boot.img artifacts/boot.img
          ls -lh artifacts/boot.img

      - name: Upload YSL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ysl-msm8953-kernel
          path: artifacts/
