name: Build YSL Kernel (Clang 15)

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "Kernel branch or commit to build"
        required: true
        default: "ysl-21"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}
          submodules: recursive

      - name: Install dependencies and Clang 15
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang-15 \
            flex \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            lld-15 \
            llvm-15 \
            llvm-15-tools \
            python3 \
            rsync \
            unzip \
            zip \
            wget \
            xz-utils \
            lz4

      - name: Verify Clang 15 toolchain
        run: |
          set -eux
          clang-15 --version
          ld.lld-15 --version
          llvm-ar-15 --version
          llvm-nm-15 --version
          llvm-objcopy-15 --version
          llvm-objdump-15 --version
          llvm-strip-15 --version
          command -v arm-linux-gnueabi-gcc
          arm-linux-gnueabi-gcc --version

      - name: Configure YSL kernel
        shell: bash
        run: |
          set -eux

          export DEVICENAME=ysl
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CCACHE_DIR="$HOME/.ccache"

          ccache -M 2G || true
          rm -rf out_ysl_clang15
          mkdir -p out_ysl_clang15

          echo 'CONFIG_LOCALVERSION="-ysl-clang15"' > /tmp/lineageos_xx_devicename

          for f in \
            arch/arm64/configs/msm8953-perf_defconfig \
            arch/arm64/configs/xiaomi/xiaomi.config \
            arch/arm64/configs/xiaomi/ysl.config \
            lineageos_xx_vdso
          do
            echo "Checking $f"
            test -f "$f"
          done

          ARCH=arm64 scripts/kconfig/merge_config.sh -O out_ysl_clang15 \
            arch/arm64/configs/msm8953-perf_defconfig \
            arch/arm64/configs/xiaomi/xiaomi.config \
            arch/arm64/configs/xiaomi/ysl.config \
            lineageos_xx_vdso \
            /tmp/lineageos_xx_devicename

          make \
            ARCH=arm64 \
            O=out_ysl_clang15 \
            olddefconfig

          echo "===== FINAL CONFIG / COMPILER ====="
          grep -E \
            '^(CONFIG_LOCALVERSION=|CONFIG_MACH_XIAOMI_YSL=|CONFIG_SECURITY_SELINUX=|CONFIG_MODULES=|# CONFIG_MODULES is not set|CONFIG_MODVERSIONS=|CONFIG_COMPAT_VDSO=|CONFIG_IOSCHED_BFQ=|CONFIG_BFQ_GROUP_IOSCHED=|CONFIG_DEFAULT_BFQ=|CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=|CONFIG_SCHED_BORE=|CONFIG_ZRAM_DEFAULT_COMP_ALGORITHM=)' \
            out_ysl_clang15/.config || true

      - name: Build YSL kernel with Clang 15
        shell: bash
        run: |
          set -eux
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 2G || true

          clang-15 --version

          make -j"$(nproc)" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O=out_ysl_clang15 \
            CC='ccache clang-15' \
            AS=clang-15 \
            AR=llvm-ar-15 \
            NM=llvm-nm-15 \
            LD=ld.lld-15 \
            OBJCOPY=llvm-objcopy-15 \
            OBJDUMP=llvm-objdump-15 \
            STRIP=llvm-strip-15 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_GCC32_TC='-gcc-toolchain /usr' \
            CLANG_PREFIX32='--prefix=/usr/bin/arm-linux-gnueabi-' \
            LLVM=1 \
            LLVM_IAS=1 \
            INSTALL_MOD_STRIP=1 \
            KBUILD_BUILD_USER="$(git rev-parse --short HEAD | cut -c1-7)" \
            KBUILD_BUILD_HOST="$(git symbolic-ref --short HEAD || echo detached)" \
            KBUILD_BUILD_FEATURES='YSL test build with Ubuntu Clang 15.0.7'

          test -s out_ysl_clang15/arch/arm64/boot/Image.gz
          ccache -s
          rm -f /tmp/lineageos_xx_devicename

      - name: Create YSL Image.gz-dtb Clang 15 artifact
        shell: bash
        run: |
          set -eux
          rm -rf artifacts-clang15
          mkdir -p artifacts-clang15

          DTB="$(
            find out_ysl_clang15/arch/arm64/boot/dts \
              -type f -name '*.dtb' -print \
              | grep -Ei 'ysl|8953.*mtp' \
              | head -n1 || true
          )"

          if [ -z "$DTB" ]; then
            echo "ERROR: No YSL DTB found"
            find out_ysl_clang15/arch/arm64/boot/dts -type f -name '*.dtb' -print | sort
            exit 1
          fi

          echo "Using DTB: $DTB"
          cat out_ysl_clang15/arch/arm64/boot/Image.gz "$DTB" \
            > artifacts-clang15/Image.gz-dtb-clang15
          test -s artifacts-clang15/Image.gz-dtb-clang15
          ls -lh artifacts-clang15/Image.gz-dtb-clang15

      - name: Upload YSL Clang 15 kernel
        uses: actions/upload-artifact@v4
        with:
          name: ysl-Image.gz-dtb-clang15
          path: artifacts-clang15/Image.gz-dtb-clang15
          if-no-files-found: error
