name: Build YSL Kernel (Clang 23)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref || github.ref_name }}
          submodules: recursive

      - name: Install dependencies and Clang 23
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            python3 \
            rsync \
            unzip \
            zip \
            wget \
            xz-utils \
            lz4
          
          # Ubuntu 22.04's default repositories may not provide Clang/LLVM 18.
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y clang-23 lld-23 llvm-23 llvm-23-tools

      - name: Verify Clang 23 toolchain
        run: |
          set -eux
          clang-23 --version
          ld.lld-23 --version
          llvm-ar-23 --version
          llvm-nm-23 --version
          llvm-objcopy-23 --version
          llvm-objdump-23 --version
          llvm-strip-23 --version
          # Provide an unversioned LLD path for build tools.
          sudo ln -sf /usr/bin/ld.lld-23 /usr/local/bin/ld.lld
          command -v ld.lld
          ld.lld --version
          command -v arm-linux-gnueabi-gcc
          arm-linux-gnueabi-gcc --version

      - name: Configure YSL kernel
        shell: bash
        run: |
          set -eux

          export DEVICENAME=ysl
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CCACHE_DIR="$HOME/.ccache"

          ccache -M 2G || true
          rm -rf out_ysl_clang23
          mkdir -p out_ysl_clang23

          echo 'CONFIG_LOCALVERSION="-ysl-clang23"' > /tmp/lineageos_xx_devicename

          for f in \
            arch/arm64/configs/msm8953-perf_defconfig \
            arch/arm64/configs/xiaomi/xiaomi.config \
            arch/arm64/configs/xiaomi/ysl.config
          do
            echo "Checking $f"
            test -f "$f"
          done

          ARCH=arm64 scripts/kconfig/merge_config.sh -O out_ysl_clang23 \
            arch/arm64/configs/msm8953-perf_defconfig \
            arch/arm64/configs/xiaomi/xiaomi.config \
            arch/arm64/configs/xiaomi/ysl.config \
            /tmp/lineageos_xx_devicename

          make \
            ARCH=arm64 \
            O=out_ysl_clang23 \
            V=1 \
            olddefconfig

          echo "===== FINAL CONFIG / COMPILER ====="
          grep -E \
            '^(CONFIG_LOCALVERSION=|CONFIG_MACH_XIAOMI_YSL=|CONFIG_SECURITY_SELINUX=|CONFIG_MODULES=|# CONFIG_MODULES is not set|CONFIG_MODVERSIONS=|CONFIG_IOSCHED_BFQ=|CONFIG_BFQ_GROUP_IOSCHED=|CONFIG_DEFAULT_BFQ=|CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=|CONFIG_SCHED_BORE=|CONFIG_ZRAM_DEFAULT_COMP_ALGORITHM=)' \
            out_ysl_clang23/.config || true

      - name: Build YSL kernel with Clang 23
        shell: bash
        run: |
          set -eux
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 2G || true

          clang-23 --version

          make -j"$(nproc)" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O=out_ysl_clang23 \
            V=1 \
            CC='ccache clang-23 -fuse-ld=lld' \
            AS=clang-23 \
            AR=llvm-ar-23 \
            NM=llvm-nm-23 \
            LD=ld.lld-23 \
            OBJCOPY=llvm-objcopy-23 \
            OBJDUMP=llvm-objdump-23 \
            STRIP=llvm-strip-23 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_GCC32_TC='--gcc-toolchain=/usr' \
            CLANG_PREFIX32='--prefix=/usr/bin/arm-linux-gnueabi-' \
            LLVM=1 \
            LLVM_IAS=1 \
            INSTALL_MOD_STRIP=1 \
            KBUILD_BUILD_USER="$(git rev-parse --short HEAD | cut -c1-7)" \
            KBUILD_BUILD_HOST="$(git symbolic-ref --short HEAD || echo detached)" \
            KBUILD_BUILD_FEATURES='YSL test build with Ubuntu Clang 23.1.3'

          test -s out_ysl_clang23/arch/arm64/boot/Image.gz
          ccache -s

      - name: Create YSL Image.gz-dtb artifact
        shell: bash
        run: |
          set -eux
          rm -rf artifacts-clang23
          mkdir -p artifacts-clang23

          DTB="$(
            find out_ysl_clang23/arch/arm64/boot/dts \
              -type f -name '*.dtb' -print \
              | grep -Ei 'ysl|8953.*mtp' \
              | head -n1 || true
          )"

          if [ -z "$DTB" ]; then
            echo "ERROR: No YSL DTB found"
            find out_ysl_clang23/arch/arm64/boot/dts -type f -name '*.dtb' -print | sort
            exit 1
          fi

          echo "Using DTB: $DTB"
          cat out_ysl_clang23/arch/arm64/boot/Image.gz "$DTB" \
            > artifacts-clang23/Image.gz-dtb
          test -s artifacts-clang23/Image.gz-dtb
          ls -lh artifacts-clang23/Image.gz-dtb

      - name: Upload YSL Clang 23 kernel
        uses: actions/upload-artifact@v4
        with:
          name: ysl-Image.gz-dtb
          path: artifacts-clang23/Image.gz-dtb
          if-no-files-found: error
